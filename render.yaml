services:
  - type: web
    name: stackoverflow-survey-dashboard
    runtime: python
    plan: free
    region: ohio
    branch: dash-plotly-mockup
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT dashboard_dash_plotly.app:server
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
